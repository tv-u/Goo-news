<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <title>AI GO-NEWS | 50+ Categories</title>
    <style>
        :root { --bg: #09090b; --card: #18181b; --pink: #ff2a75; --text: #f4f4f5; --muted: #a1a1aa; --border: #27272a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 80px; }
        
        header { display: flex; flex-direction: column; padding: 12px 16px; background: rgba(9,9,11,0.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); gap: 10px; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.2rem; font-weight: 900; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .logo span { background: var(--pink); padding: 3px 6px; border-radius: 4px; font-size: 0.8rem; color: white; }
        .search-box { display: flex; align-items: center; background: var(--card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 20px; width: 100%; }
        .search-box input { background: transparent; border: none; color: white; outline: none; width: 100%; font-size: 0.9rem; }

        nav { display: flex; overflow-x: auto; padding: 12px 16px; gap: 8px; scrollbar-width: none; position: sticky; top: 93px; background: rgba(9,9,11,0.9); backdrop-filter: blur(12px); z-index: 99; border-bottom: 1px solid var(--border); }
        nav::-webkit-scrollbar { display: none; }
        .nav-btn { padding: 6px 14px; border-radius: 20px; background: var(--card); border: 1px solid var(--border); color: var(--muted); cursor: pointer; white-space: nowrap; font-size: 0.85rem; font-weight: 600; text-transform: capitalize; }
        .nav-btn.active { background: var(--pink); color: white; border-color: var(--pink); }

        .grid { padding: 16px; display: grid; grid-template-columns: 1fr; gap: 16px; }
        @media(min-width: 600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        @media(min-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
        .card-img { width: 100%; height: 180px; object-fit: cover; background: #27272a; }
        .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
        .badge { background: rgba(255,42,117,0.15); color: var(--pink); padding: 3px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; align-self: flex-start; margin-bottom: 8px; text-transform: uppercase; }
        .card-title { font-size: 1rem; line-height: 1.4; margin-bottom: 8px; font-weight: 700; }
        .card-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 12px; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }
        .source { color: #3b82f6; font-weight: 700; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 1000; overflow-y: auto; }
        .modal-header { position: sticky; top: 0; background: var(--card); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); z-index: 10; }
        .modal-close { background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; padding: 5px; }
        .modal-content { padding: 20px; max-width: 800px; margin: 0 auto; }
        .modal-img { width: 100%; border-radius: 12px; margin-bottom: 16px; }
        .modal-title { font-size: 1.4rem; margin-bottom: 12px; line-height: 1.3; font-weight: 800; }
        .modal-text { font-size: 1rem; line-height: 1.6; color: var(--muted); margin-bottom: 20px; white-space: pre-wrap; }
        .btn-full { display: block; text-align: center; background: var(--pink); color: white; padding: 14px; border-radius: 12px; text-decoration: none; font-weight: bold; font-size: 1rem; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 100; }
        .bottom-nav div { color: var(--muted); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .bottom-nav div.active { color: var(--pink); }
        .bottom-nav div span { font-size: 1.2rem; }
    </style>

<!-- GOO_UNIQUE_ORIGINAL_POSTER_V1 -->
<script>
(function(){
  const used = new Map();
  const owners = new Map();

  window.gooUniquePoster = function(article){
    if(!article || typeof article !== 'object') return '';

    const key = String(
      article.id || article.article_id ||
      article.url || article.link ||
      article.title || ''
    ).trim();

    if(!key) return '';

    if(owners.has(key)) return owners.get(key);

    const candidates = [
      article.image_url,
      article.image,
      article.urlToImage,
      article.thumbnail,
      article.featured_image,
      article.media_url
    ];

    let selected = '';

    for(const candidate of candidates){
      if(typeof candidate !== 'string') continue;

      const url = candidate.trim();
      if(!/^https?:\/\//i.test(url)) continue;

      // फेक/डमी इमेजेस को ब्लॉक करें
      if(/picsum\.photos|placeholder|dummyimage|via\.placeholder/i.test(url))
        continue;

      let normalized;
      try {
        normalized = new URL(url).href;
      } catch(e) {
        continue;
      }

      const existing = used.get(normalized);

      // अगर इमेज पहले से इस्तेमाल हो चुकी है, तो स्किप करें
      if(existing && existing !== key) continue;

      selected = normalized;
      used.set(normalized, key);
      break;
    }

    owners.set(key, selected);
    return selected;
  };
})();
</script>

</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo" onclick="window.location.hash=''"><span>AI</span> GO-NEWS</div>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search 50+ categories news...">
            <span>🔍</span>
        </div>
    </header>
    
    <nav id="navContainer">
        <!-- Categories will be injected dynamically here -->
    </nav>
    
    <div class="grid" id="newsGrid"></div>
    
    <div class="bottom-nav">
        <div class="active" onclick="filterCategory('all')"><span>🏠</span>Home</div>
    </div>

    <div class="modal" id="newsModal">
        <div class="modal-header">
            <div style="font-weight: bold; font-size: 0.9rem;">Article Reader</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-content">
            <img src="" id="modalImg" class="modal-img" onerror="this.style.display='none'">
            <h2 class="modal-title" id="modalTitle"></h2>
            <div class="modal-text" id="modalText"></div>
            <a href="#" target="_blank" class="btn-full" id="modalLink">Read Full Article ↗</a>
        </div>
    </div>

    <script>
        let allNews = [], filteredNews = [], page = 1, limit = 15, currentCat = 'all';
        const grid = document.getElementById('newsGrid');
        const navContainer = document.getElementById('navContainer');
        const searchInput = document.getElementById('searchInput');

        async function init() {
            try {
                const res = await fetch('./news.json?t=' + new Date().getTime());
                allNews = await res.json();
                buildNav();
                handleRouting();
            } catch(e) {
                grid.innerHTML = '<p style="text-align:center;color:red;grid-column:1/-1;">Error loading news data.</p>';
            }
        }

        function buildNav() {
            const categories = ['all', ...new Set(allNews.map(n => n.category))];
            navContainer.innerHTML = categories.map(cat => `
                <button class="nav-btn ${cat === 'all' ? 'active' : ''}" data-cat="${cat}" onclick="filterCategory('${cat}')">
                    ${cat === 'all' ? '📰 All' : cat.replace('_', ' ')}
                </button>
            `).join('');
        }

        function filterCategory(cat) {
            currentCat = cat;
            window.location.hash = '';
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
            
            let temp = allNews.filter(n => cat === 'all' || (n.category && n.category.toLowerCase() === cat.toLowerCase()));
            
            // Apply search filter if typed
            const query = searchInput.value.toLowerCase();
            if (query) {
                temp = temp.filter(n => n.title.toLowerCase().includes(query) || n.snippet.toLowerCase().includes(query));
            }
            
            filteredNews = temp;
            page = 1; grid.innerHTML = ''; renderGrid();
        }

        function renderGrid() {
            const toShow = filteredNews.slice((page - 1) * limit, page * limit);
            if(toShow.length === 0 && page === 1) {
                grid.innerHTML = '<p style="text-align:center;color:gray;grid-column:1/-1;">No news found for this category/search.</p>';
                return;
            }
            toShow.forEach(n => {
                const card = document.createElement('div'); card.className = 'card';
                card.onclick = () => { window.location.hash = `article/${n.id}`; };
                card.innerHTML = `
                    <img src="${window.gooUniquePoster(n)}" onerror="this.style.display=\'none\'" class="card-img" loading="lazy" onerror="this.style.display='none'">
                    <div class="card-body">
                        <span class="badge">${n.category.replace('_',' ')}</span>
                        <div class="card-title">${n.title}</div>
                        <div class="card-desc">${n.snippet}</div>
                        <div class="card-footer"><span class="source">${n.source}</span><span>${new Date(n.pubDate).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span></div>
                    </div>`;
                grid.appendChild(card);
            });
            page++;
        }

        function openModal(news) {
            document.getElementById('modalImg').src = news.image;
            document.getElementById('modalImg').style.display = 'block';
            document.getElementById('modalTitle').innerText = news.title;
            document.getElementById('modalText').innerText = news.fullText || news.snippet;
            document.getElementById('modalLink').href = news.link;
            document.getElementById('newsModal').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('newsModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            window.location.hash = ''; 
        }

        function handleRouting() {
            const hash = window.location.hash;
            if (hash.startsWith('#article/')) {
                const id = hash.replace('#article/', '');
                const article = allNews.find(n => n.id === id);
                if (article) openModal(article);
                else filterCategory('all');
            } else {
                document.getElementById('newsModal').style.display = 'none';
                document.body.style.overflow = 'auto';
                if(filteredNews.length === 0) filterCategory('all');
            }
        }

        // Search Listener
        searchInput.addEventListener('input', () => {
            filterCategory(currentCat);
        });

        window.addEventListener('hashchange', handleRouting);
        window.addEventListener('scroll', () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500 && filteredNews.length > (page - 1) * limit) {
                renderGrid();
            }
        });

        init();
    </script>
</body>
</html>
