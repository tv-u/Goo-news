<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GO-NEWS | CoverNews Live</title><style>:root{--p:#bb1919;--d:#181818;--bg:#f2f2f2}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:var(--bg);color:#111}.top{background:#111;color:#ccc;font-size:12px;padding:6px 15px;display:flex;justify-content:space-between}.top button{background:#333;color:#fff;border:0;padding:2px 8px;border-radius:3px;cursor:pointer}.top button.act{background:var(--p)}header{background:var(--d);color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:28px;font-weight:900}.logo span{background:var(--p);padding:1px 7px;border-radius:3px}nav{background:#222;border-top:3px solid var(--p);display:flex;overflow-x:auto}nav button{background:none;border:0;color:#fff;padding:12px 15px;font-weight:700;text-transform:uppercase;cursor:pointer;white-space:nowrap}nav button.act,nav button:hover{background:var(--p)}.tkr{background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;height:36px}.tkr b{background:var(--p);color:#fff;padding:0 12px;height:100%;display:flex;align-items:center;font-size:12px}.wrap{max-width:1200px;margin:20px auto;padding:0 15px;display:grid;grid-template-columns:1fr 300px;gap:20px}@media(max-width:850px){.wrap{grid-template-columns:1fr}}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}.card{background:#fff;border:1px solid #e0e0e0;border-radius:4px;overflow:hidden}.card img{width:100%;height:160px;object-fit:cover;background:#222}.cb{padding:12px}.cb a{font-size:15px;font-weight:700;color:#111;text-decoration:none;display:block;margin-bottom:8px}.cb a:hover{color:var(--p)}.meta{font-size:11px;color:#666;display:flex;justify-content:space-between}.side{background:#fff;border:1px solid #e0e0e0;padding:15px;border-radius:4px}.sh{font-weight:800;border-bottom:2px solid var(--p);padding-bottom:5px;margin-bottom:12px;text-transform:uppercase}.ti{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}.ti b{background:var(--p);color:#fff;padding:2px 6px;border-radius:2px;height:fit-content}</style></head><body><div class="top"><span id="clk"></span><div><button id="be" class="act" onclick="sl('en')">EN</button> <button id="bh" onclick="sl('hi')">HI</button></div></div><header><div class="logo">GO-<span>NEWS</span></div><button onclick="ld()" style="background:#1e3a2f;color:#4ade80;border:1px solid #2e5a44;padding:5px 12px;border-radius:15px;cursor:pointer">Auto-Sync Live</button></header><nÍv id="nv"><button class="act" onclick="sc(this,'top')">Home</button><button onclick="sc(this,'world')">World</button><button onclick="sc(this,'tech')">Tech</button><button onclick="sc(this,'business')">Business</button><button onclick="sc(this,'sports')">Sports</button></nav><div class="tkr"><b>BREAKING</b><marquee id="mq" style="padding:0 10px;font-size:13px;font-weight:600">Syncing...</marquee></div><div class="wrap"><main><div class="sh" id="hd">Top Stories</div><div class="grid" id="gd">Loading...</div></main><aside><div class="side"><div class="sh">Trending</div><div id="tr"></div></div></aside></div><script>let L='en',C='top';const F={en:{top:'https://feeds.bbci.co.uk/news/rss.xml',world:'https://feeds.bbci.co.uk/news/world/rss.xml',tech:'https://feeds.bbci.co.uk/news/technology/rss.xml',business:'https://feeds.bbci.co.uk/news/business/rss.xml',sports:'https://feeds.bbci.co.uk/sport/rss.xml'},hi:{top:'https://feeds.bbci.co.uk/hindi/rss.xml',world:'https://feeds.bbci.co.uk/hindi/international/rss.xml',tech:'https://feeds.bbci.co.uk/hindi/science/rss.xml',business:'https://feeds.bbci.co.uk/hindi/india/rss.xml',sports:'https://feeds.bbci.co.uk/hindi/sport/rss.xml'}};setInterval(()=>document.getElementById('klk')||(document.getElementById('clk')).innerText=new Date().toLocaleString(),1000);function sl(l){L=l;document.getElementById('be').className=l=='en'?'act':'';document.getElementById('bh').className=l=='hi'?'act':'';ld()}function sc(e,c){document.querySelectorAll('nav button').forEach(b=>b.className='');e.className='act';C=c;document.getElementById('hd').innerText=e.innerText;ld()}function ld(){fetch('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(F[L][C])).then(r=>r.json()).then(d=>{let I=d.items||[];document.getElementById('mq').innerText=I.slice(0,5).map(x=>'* '+x.title).join('   ');document.getElementById('gd').innerHTML=I.map(x=>`<div class="card"><img src="${x.thumbnail||'https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=500'}"><div class="cb"><a href="${x.link}" target="_blank">${x.title}</a><div class="meta"><span>GO-NEWS</span><span>${(x.pubDate||'').split(' ')[0]}</span></div></div></div>`).join('');document.getElementById('gr')||(document.getElementById('tr')).innerHTML=I.slice(0,5).map((x,i)=>`<div class="ti"><b>${i+1}</b><a href="${x.link}" target="_blank" style="color:#111;text-decoration:none">${x.title}</a></div>`).join('')})}ld()</script></body></html>
