name: Daily Auto Viral News Sync

on:
  schedule:
    - cron: '0 0,6,12,18 * * *' # दिन में 4 बार (हर 6 घंटे में) ऑटोमैटिक सिंक होगा
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install feedparser requests

      - name: Run Viral News Bot
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: python news_bot.py

      - name: Auto Commit and Live Deploy
        run: |
          git config --global user.name "Goo News Automation Bot"
          git config --global user.email "bot@geonews.internal"
          git add news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync and humanize trending viral news" && git push)
