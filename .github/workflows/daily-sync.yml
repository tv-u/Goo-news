name: Daily Auto Sync
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync timestamp
        run: |
          echo "Last auto-sync: $(date -u)" > .last-sync
          git config user.name "autosync-bot"
          git config user.email "autosync-bot@users.noreply.github.com"
          git add .last-sync
          git commit -m "Auto-sync: $(date -u)" || echo "No changes to commit"
          git push
