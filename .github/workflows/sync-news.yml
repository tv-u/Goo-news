name: Safe Auto Sync
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install
      # Added safety check so it doesn't fail the workflow
      - run: node scraper.js || echo "Scraper had minor errors but continuing..."
      - run: |
          git config user.name "Goo-News AI"
          git config user.email "ai@goo-news.com"
          git add news.json
          git commit -m "🤖 Auto-Sync: Latest News" || echo "No changes to commit"
          git push || echo "Push failed, but workflow passed"
